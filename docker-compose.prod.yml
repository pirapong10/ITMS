version: '3.8'

services:
  # 1. PostgreSQL Production Database
  postgres:
    image: postgres:16-alpine
    container_name: itsm_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-itsm_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm_admin} -d ${POSTGRES_DB:-itsm_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_internal_network

  # 2. Next.js 16 Web Application (Standalone Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itsm_prod_app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-itsm_admin}:${POSTGRES_PASSWORD:-secure_prod_password_change_me}@postgres:5432/${POSTGRES_DB:-itsm_prod}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-prod-minimum-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itsm_internal_network
    expose:
      - "3000"

  # 3. Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: itsm_prod_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - itsm_internal_network

volumes:
  postgres_prod_data:
    name: itsm_postgres_prod_data

networks:
  itsm_internal_network:
    name: itsm_prod_network
    driver: bridge
