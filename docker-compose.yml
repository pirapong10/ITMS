version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: itsm_postgres
    environment:
      POSTGRES_USER: itsm_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: itsm_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
